on: push

name: React Release

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mysql, mysqlnd, sqlite3, bcmath, gd, curl, zip, openssl, mbstring, xml

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v5-develop
          fetch-depth: 1

      - name: Install composer dependencies
        run: |
          composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          composer install --no-dev

      - name: Cleanup Builds
        run: |
          rm -rf node_modules
          rm -rf .git
          rm .env || true
          rm -rf ui || true
          # Set permissions: directories 755, files 644
          # chmod -R a=r,u+w,a+X .          
          ls -al ./vendor/bin/*
          # find . -path ./vendor -prune -type f -o -exec chmod 644 {} \+
          find . -path ./vendo -prune -o -type f -exec chmod 644 {} \+
          # find . -path ./vendor -prune -type d -o -exec chmod 755 {} \+
          find . -path ./vendor -prune -o -type d -exec chmod 755 {} \+
          ls -al ./vendor/bin/*
          ls -al

      - name: Build project
        run: |
          shopt -s dotglob
          tar --exclude='public/storage' --exclude='invoiceninja.zip' -zcf /home/runner/work/invoiceninja/invoiceninja.tar *
          cd ../
          tar --exclude='public/storage' --exclude='invoiceninja.zip' -zcf invoiceninja.tar.gz invoiceninja/
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            /home/runner/work/invoiceninja/invoiceninja.tar
            /home/runner/work/invoiceninja/invoiceninja.tar.gz
